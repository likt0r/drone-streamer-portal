# Make the portal reachable by hostname from devices on the Pi's "pi-caster" WiFi AP.
#
# The AP is a NetworkManager "shared" connection (wlan0 = 192.168.50.5); NM runs a
# dnsmasq for it that also serves DNS to AP clients and loads extra config from
# /etc/NetworkManager/dnsmasq-shared.d/. These records resolve the hostname to the
# AP address over normal (unicast) DNS, so it works on iOS *and* Android — Android
# browsers generally do not resolve mDNS/.local names.
#
# Apply after editing: sudo kill -HUP $(cat /run/nm-dnsmasq-wlan0.pid)
address=/pi-caster.local/192.168.50.5
address=/pi-caster.box/192.168.50.5
address=/pi-caster/192.168.50.5

##############################################################
# Nginx – Production config for Raspberry Pi
#
# Assumes:
#   - Built Vue app lives at /var/www/drone-streamer-portal/dist
#   - MediaMTX runs locally on the Pi (localhost)
#
# Routes:
#   /                     → static Vue build (dist/)
#   /{stream}/whep|whip   → MediaMTX WebRTC  (localhost:8889)
#   /hls/                 → MediaMTX HLS     (localhost:8888)
#   /webrtc/              → MediaMTX WebRTC  (localhost:8889, for player UI)
#   /mediamtx-api/        → MediaMTX API     (localhost:9997)
##############################################################

server {
    listen 80;
    server_name _;          # catch-all; replace with hostname/IP if needed

    root /var/www/drone-streamer-portal/dist;
    index index.html;

    # ── MediaMTX – WHEP (WebRTC playback) & WHIP (publish) ──
    # Must come BEFORE the SPA catch-all try_files.
    location ~ ^/[^/]+/whe?p {
        proxy_pass http://127.0.0.1:8889;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── MediaMTX – WebRTC player UI (:8889) ─────────────────
    location /webrtc/ {
        rewrite ^/webrtc/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8889;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── MediaMTX – HLS (:8888) ───────────────────────────────
    location /hls/ {
        rewrite ^/hls/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8888;

        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control no-cache;
    }

    # ── MediaMTX – Control API (:9997) ───────────────────────
    location /mediamtx-api/ {
        rewrite ^/mediamtx-api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9997;
        proxy_set_header Host $host;
    }

    # ── Web app manifest – not in nginx's default mime.types ─
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # ── Vue SPA – serve static build, fallback to index.html ─
    location / {
        try_files $uri $uri/ /index.html;

        # Cache aggressively for hashed assets (vite output)
        location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

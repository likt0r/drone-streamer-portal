##############################################################
# Nginx – DEV config for Raspberry Pi (bare metal, no Docker)
#
# Same as prod.conf, but instead of serving the static dist/ it reverse-proxies
# "/" to the Vite dev server (HMR) on 127.0.0.1:5173. The MediaMTX streaming
# routes are identical to prod, so WHEP/HLS/WebRTC keep working unchanged.
#
# Switch with: scripts/dev-mode.sh dev | prod
#
# Routes:
#   /                     → Vite dev server   (127.0.0.1:5173, HMR via WebSocket)
#   /{stream}/whep|whip   → MediaMTX WebRTC    (127.0.0.1:8889)
#   /hls/                 → MediaMTX HLS       (127.0.0.1:8888)
#   /webrtc/              → MediaMTX WebRTC    (127.0.0.1:8889)
#   /mediamtx-api/        → MediaMTX API       (127.0.0.1:9997)
##############################################################

server {
    listen 80;
    server_name _;          # catch-all

    # ── MediaMTX – WHEP (WebRTC playback) & WHIP (publish) ──
    # Must come BEFORE the Vite catch-all below.
    location ~ ^/[^/]+/whe?p {
        proxy_pass http://127.0.0.1:8889;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── MediaMTX – WebRTC player UI (:8889) ─────────────────
    location /webrtc/ {
        rewrite ^/webrtc/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8889;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── MediaMTX – HLS (:8888) ───────────────────────────────
    location /hls/ {
        rewrite ^/hls/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8888;

        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control no-cache;
    }

    # ── MediaMTX – Control API (:9997) ───────────────────────
    location /mediamtx-api/ {
        rewrite ^/mediamtx-api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9997;
        proxy_set_header Host $host;
    }

    # ── Vite dev server (Vue app + HMR) ──────────────────────
    location / {
        proxy_pass http://127.0.0.1:5173;

        # Required for Vite HMR (WebSocket) + general proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

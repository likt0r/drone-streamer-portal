##############################################################
# Nginx reverse proxy for local development
#
# Routes:
#   /           → Vite dev server       (host:5173)
#   /stream/    → MediaMTX WebRTC/HLS   (host:8889 / host:8888)
#   /rtsp/      → MediaMTX RTSP API     (host:8554)
##############################################################

server {
    listen 80;
    server_name localhost;

    # ── MediaMTX – WHEP (WebRTC playback) & WHIP (publish) ──
    # Must come BEFORE the Vite catch-all below.
    # Matches /{streamname}/whep and /{streamname}/whip
    location ~ ^/[^/]+/whe?p {
        proxy_pass http://host.docker.internal:8889;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Vite dev server (Vue app) ────────────────────────────
    location / {
        proxy_pass http://host.docker.internal:5173;

        # Required for Vite HMR (WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── MediaMTX – WebRTC HTTP signalling (:8889) ────────────
    location /webrtc/ {
        rewrite ^/webrtc/(.*) /$1 break;
        proxy_pass http://host.docker.internal:8889;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── MediaMTX – HLS (:8888) ───────────────────────────────
    location /hls/ {
        rewrite ^/hls/(.*) /$1 break;
        proxy_pass http://host.docker.internal:8888;

        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control no-cache;
    }

    # ── MediaMTX – Control API (:9997) ───────────────────────
    location /mediamtx-api/ {
        rewrite ^/mediamtx-api/(.*) /$1 break;
        proxy_pass http://host.docker.internal:9997;
        proxy_set_header Host $host;
    }
}

##############################################################
# Nginx block to test the production build (dist) on port 81
##############################################################
server {
    listen 81;
    server_name localhost;

    root /usr/share/nginx/html/dist;
    index index.html;

    # ── MediaMTX – WHEP (WebRTC playback) & WHIP (publish) ──
    location ~ ^/[^/]+/whe?p {
        proxy_pass http://host.docker.internal:8889;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── MediaMTX – WebRTC player UI (:8889) ─────────────────
    location /webrtc/ {
        rewrite ^/webrtc/(.*) /$1 break;
        proxy_pass http://host.docker.internal:8889;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── MediaMTX – HLS (:8888) ───────────────────────────────
    location /hls/ {
        rewrite ^/hls/(.*) /$1 break;
        proxy_pass http://host.docker.internal:8888;

        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control no-cache;
    }

    # ── MediaMTX – Control API (:9997) ───────────────────────
    location /mediamtx-api/ {
        rewrite ^/mediamtx-api/(.*) /$1 break;
        proxy_pass http://host.docker.internal:9997;
        proxy_set_header Host $host;
    }

    # ── Vue SPA – serve static build, fallback to index.html ─
    location / {
        try_files $uri $uri/ /index.html;

        # Cache aggressively for hashed assets (vite output)
        location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

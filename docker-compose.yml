services:
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
      - "5001:81"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html/dist:ro
    extra_hosts:
      # Allow nginx inside Docker to reach services on the host machine
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

name: Release

on:
  push:
    tags:
      - 'v*.*.*' # triggers on version tags like v1.0.0, v2.3.1, etc.

permissions:
  contents: write # needed to create GitHub Releases

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Vue app
        run: bun run build-only

      - name: Package build artefact
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="drone-streamer-portal-${VERSION}.tar.gz"
          tar -czf "${ARCHIVE}" -C dist .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build Debian package (arm64)
        run: |
          bash scripts/build-deb.sh "${GITHUB_REF_NAME#v}"
          echo "DEB=build/drone-streamer-portal_${GITHUB_REF_NAME#v}_arm64.deb" >> "$GITHUB_ENV"
          echo "DEB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Release ${{ env.VERSION }}'
          body: |
            ## drone-streamer-portal ${{ env.VERSION }}

            ### Install / update on Raspberry Pi

            One Debian package contains everything (frontend, backend, MediaMTX, nginx site, systemd units). Installing it again updates an existing installation in place; a user-edited `mediamtx.yml` is preserved.

            ```bash
            curl -fsSL https://raw.githubusercontent.com/likt0r/drone-streamer-portal/${{ env.VERSION }}/scripts/install-pi.sh | sudo bash
            ```

            Or manually:

            ```bash
            curl -fsSLO https://github.com/likt0r/drone-streamer-portal/releases/download/${{ env.VERSION }}/drone-streamer-portal_${{ env.DEB_VERSION }}_arm64.deb
            sudo apt install ./drone-streamer-portal_*_arm64.deb
            ```

            The `drone-streamer-portal-${{ env.VERSION }}.tar.gz` below is just the frontend build (legacy artefact).
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.DEB }}
          fail_on_unmatched_files: true

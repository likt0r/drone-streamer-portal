name: Release

on:
  push:
    tags:
      - 'v*.*.*' # triggers on version tags like v1.0.0, v2.3.1, etc.

permissions:
  contents: write # needed to create GitHub Releases

# Opt the JS actions into Node.js 24 (Node 20 runtime is being removed from the
# runners). Avoids the deprecation warnings on actions/checkout, upload-artifact, etc.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Vue app
        run: bun run build-only

      - name: Package build artefact
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="drone-streamer-portal-${VERSION}.tar.gz"
          tar -czf "${ARCHIVE}" -C dist .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build Debian package (arm64)
        run: |
          bash scripts/build-deb.sh "${GITHUB_REF_NAME#v}"
          echo "DEB=build/drone-streamer-portal_${GITHUB_REF_NAME#v}_arm64.deb" >> "$GITHUB_ENV"
          echo "DEB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Upload .deb for the apt-repo job
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: ${{ env.DEB }}
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Release ${{ env.VERSION }}'
          body: |
            ## drone-streamer-portal ${{ env.VERSION }}

            One Debian package contains everything (frontend, backend, MediaMTX, nginx site, systemd units). A user-edited `mediamtx.yml` is preserved across updates.

            ### Install on Raspberry Pi (recommended – apt repository)

            Registers the signed apt repo so future updates are just `sudo apt update && sudo apt upgrade`:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/likt0r/drone-streamer-portal/${{ env.VERSION }}/scripts/install-pi.sh | sudo bash
            ```

            ### Offline / manual

            ```bash
            curl -fsSLO https://github.com/likt0r/drone-streamer-portal/releases/download/${{ env.VERSION }}/drone-streamer-portal_${{ env.DEB_VERSION }}_arm64.deb
            sudo apt install ./drone-streamer-portal_*_arm64.deb
            ```

            The `drone-streamer-portal-${{ env.VERSION }}.tar.gz` below is just the frontend build (legacy artefact).
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.DEB }}
          fail_on_unmatched_files: true

  publish-apt-repo:
    name: Publish signed apt repository to GitHub Pages
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard – require GPG_PRIVATE_KEY secret
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::warning::GPG_PRIVATE_KEY secret not set – skipping apt repo publish."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Install reprepro
        if: ${{ env.SKIP != '1' }}
        run: sudo apt-get update -qq && sudo apt-get install -y reprepro

      - name: Download built .deb
        if: ${{ env.SKIP != '1' }}
        uses: actions/download-artifact@v4
        with:
          name: deb
          path: incoming

      - name: Import signing key
        if: ${{ env.SKIP != '1' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # Headless signing: reprepro signs the Release via gpgme/gpg-agent.
          # Without this the agent tries to open a pinentry tty and fails with
          # "Inappropriate ioctl for device". Loopback lets it take the
          # passphrase from us instead.
          printf 'allow-loopback-pinentry\ndefault-cache-ttl 7200\nmax-cache-ttl 7200\n' > ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n' > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          echo "GPG_FPR=${FPR}" >> "$GITHUB_ENV"
          # Passphrase-protected key: prime the agent cache so the later
          # reprepro sign succeeds non-interactively. Passphrase-less keys need
          # nothing here (the loopback config alone is enough).
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            echo priming | gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" -u "${FPR}" --sign --output /dev/null
          fi

      - name: Check out existing gh-pages (accumulate older versions)
        if: ${{ env.SKIP != '1' }}
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo \
            || { mkdir repo; echo "gh-pages branch does not exist yet – starting fresh"; }
          rm -rf repo/.git

      - name: Generate repository metadata
        if: ${{ env.SKIP != '1' }}
        run: |
          mkdir -p repo/conf
          sed "s/__GPG_FINGERPRINT__/${GPG_FPR}/" apt-repo/conf/distributions > repo/conf/distributions
          reprepro -b repo includedeb stable incoming/*.deb
          # Publish the public key next to the repo so clients can trust it
          gpg --armor --export "${GPG_FPR}" > repo/public.key

      - name: Deploy to GitHub Pages
        if: ${{ env.SKIP != '1' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: true
